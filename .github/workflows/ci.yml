name: Fursa CI

on:
  push:
    branches: [main]
    paths:
      - "fursa/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "fursa/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fursa-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fursa

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: fursa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

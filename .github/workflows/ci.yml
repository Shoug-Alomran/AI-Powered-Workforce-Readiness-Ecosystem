name: Fursa CI

on:
  push:
    branches: [main]
    paths:
      - "Fursah/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Fursah/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fursa-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Fursah

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      # A throwaway SQLite file so build-time prerendering has real tables to
      # query instead of failing on "no such table".
      DATABASE_URL: file:./prisma/ci.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: Fursah/package-lock.json

      - name: Use lockfile npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create CI database schema
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build

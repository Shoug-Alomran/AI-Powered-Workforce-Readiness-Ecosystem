name: Deploy Firebase rules

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firestore rules and indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[format('{0}_{1}', 'FIREBASE_SERVICE_ACCOUNT_FURSA', 'A4F06')] }}

      - name: Deploy Firestore configuration
        working-directory: fursa
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project fursa-a4f06 --non-interactive

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fursa-ai"
version = "0.1.0"
description = "RAG + ML pipeline for Fursa, an AI-powered workforce readiness ecosystem (ITU-T Y.3172 aligned)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
